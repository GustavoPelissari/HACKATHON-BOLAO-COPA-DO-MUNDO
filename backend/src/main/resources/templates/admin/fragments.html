<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ===== HEAD comum ===== -->
<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Bolao Copa 2026'">Bolao Copa 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<!-- ===== SIDEBAR ===== -->
<aside th:fragment="sidebar(pagina)" class="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">⚽</span>
        <span>Bolao Copa 2026</span>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" th:classappend="${pagina == 'dashboard'} ? 'ativo'">
            <i class="bi bi-speedometer2"></i> Dashboard</a>
        <a th:href="@{/admin/selecoes}" th:classappend="${pagina == 'selecoes'} ? 'ativo'">
            <i class="bi bi-flag"></i> Selecoes</a>
        <a th:href="@{/admin/partidas}" th:classappend="${pagina == 'partidas'} ? 'ativo'">
            <i class="bi bi-calendar-event"></i> Partidas</a>
        <a th:href="@{/admin/usuarios}" th:classappend="${pagina == 'usuarios'} ? 'ativo'">
            <i class="bi bi-people"></i> Usuarios</a>
    </nav>
    <form method="post" th:action="@{/admin/logout}" class="sidebar-logout">
        <button type="submit" class="btn btn-sm btn-outline-light w-100">
            <i class="bi bi-box-arrow-right"></i> Sair</button>
    </form>
</aside>

<!-- ===== Mensagens flash ===== -->
<div th:fragment="alertas">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}">ok</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}">erro</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== Scripts comuns ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
