<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: cabecalho('Dashboard')}"></head>
<body class="admin-body">
<div class="layout">
    <div th:replace="~{admin/fragments :: sidebar('dashboard')}"></div>

    <main class="conteudo">
        <h1 class="titulo-pagina">Dashboard</h1>
        <p class="text-muted">Visao geral do bolao (RF-047).</p>

        <div class="row g-3 mt-1">
            <div class="col-md-3 col-sm-6">
                <div class="card-indicador">
                    <i class="bi bi-people card-indicador-icon text-primary"></i>
                    <div class="card-indicador-valor" th:text="${indicadores.totalUsuarios()}">0</div>
                    <div class="card-indicador-label">Total de usuarios</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card-indicador">
                    <i class="bi bi-ticket-detailed card-indicador-icon text-success"></i>
                    <div class="card-indicador-valor" th:text="${indicadores.totalPalpites()}">0</div>
                    <div class="card-indicador-label">Total de palpites</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card-indicador">
                    <i class="bi bi-hourglass-split card-indicador-icon text-warning"></i>
                    <div class="card-indicador-valor" th:text="${indicadores.partidasPendentes()}">0</div>
                    <div class="card-indicador-label">Partidas pendentes</div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card-indicador">
                    <i class="bi bi-activity card-indicador-icon text-danger"></i>
                    <div class="card-indicador-valor" th:text="${indicadores.usuariosAtivos24h()}">0</div>
                    <div class="card-indicador-label">Ativos (24h)</div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Atalhos</h5>
                <a th:href="@{/admin/partidas/nova}" class="btn btn-outline-primary me-2">
                    <i class="bi bi-plus-lg"></i> Nova partida</a>
                <a th:href="@{/admin/selecoes/nova}" class="btn btn-outline-primary me-2">
                    <i class="bi bi-plus-lg"></i> Nova selecao</a>
                <a th:href="@{/admin/partidas}" class="btn btn-outline-secondary">
                    <i class="bi bi-trophy"></i> Lancar resultados</a>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{admin/fragments :: scripts}"></th:block>
</body>
</html>
