<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bolao Copa 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="tela-login">
<div class="card-login shadow">
    <div class="text-center mb-4">
        <div class="login-logo">⚽</div>
        <h1 class="h4 fw-bold mt-2">Bolao Copa 2026</h1>
        <p class="text-muted">Painel Administrativo</p>
    </div>

    <div th:if="${param.erro}" class="alert alert-danger py-2">E-mail ou senha invalidos.</div>
    <div th:if="${param.saiu}" class="alert alert-success py-2">Sessao encerrada.</div>

    <form method="post" th:action="@{/admin/login}">
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="username" class="form-control" placeholder="admin@bolao.com" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" placeholder="********" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
</div>
</body>
</html>
