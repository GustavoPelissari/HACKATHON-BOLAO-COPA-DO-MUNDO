<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: cabecalho('Usuarios')}"></head>
<body class="admin-body">
<div class="layout">
    <div th:replace="~{admin/fragments :: sidebar('usuarios')}"></div>

    <main class="conteudo">
        <h1 class="titulo-pagina">Usuarios</h1>

        <div th:replace="~{admin/fragments :: alertas}"></div>

        <form method="get" th:action="@{/admin/usuarios}" class="d-flex gap-2 mt-3 mb-3" style="max-width:420px">
            <input type="text" name="busca" class="form-control" placeholder="Buscar por nome ou e-mail"
                   th:value="${busca}">
            <button class="btn btn-outline-primary"><i class="bi bi-search"></i></button>
        </form>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Pontos</th>
                        <th>Placares exatos</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th class="text-end">Acoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.nome}">Joao</td>
                        <td th:text="${u.email}">joao@email.com</td>
                        <td><strong th:text="${u.pontuacaoTotal}">0</strong></td>
                        <td th:text="${u.placaresExatos}">0</td>
                        <td>
                            <span class="badge" th:classappend="${u.admin} ? 'bg-primary' : 'bg-secondary'"
                                  th:text="${u.perfil}">USER</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.bloqueado} ? 'bg-danger' : 'bg-success'"
                                  th:text="${u.bloqueado} ? 'Bloqueado' : 'Ativo'">Ativo</span>
                        </td>
                        <td class="text-end">
                            <form method="post" th:action="@{/admin/usuarios/{id}/perfil(id=${u.id})}"
                                  class="d-inline"
                                  th:onsubmit="${u.admin} ? 'return confirm(\'Rebaixar este admin para usuario comum?\');' : 'return confirm(\'Promover este usuario a ADMIN?\');'">
                                <button class="btn btn-sm"
                                        th:classappend="${u.admin} ? 'btn-outline-secondary' : 'btn-outline-primary'"
                                        th:text="${u.admin} ? 'Rebaixar' : 'Tornar admin'">Tornar admin</button>
                            </form>
                            <form method="post" th:action="@{/admin/usuarios/{id}/bloqueio(id=${u.id})}" class="d-inline">
                                <button class="btn btn-sm"
                                        th:classappend="${u.bloqueado} ? 'btn-outline-success' : 'btn-outline-danger'"
                                        th:text="${u.bloqueado} ? 'Desbloquear' : 'Bloquear'">Bloquear</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${usuarios.isEmpty()}">
                        <td colspan="8" class="text-center text-muted py-4">Nenhum usuario encontrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav th:if="${totalPaginas > 1}" class="mt-3">
            <ul class="pagination">
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                    th:classappend="${i == paginaAtual} ? 'active'">
                    <a class="page-link" th:href="@{/admin/usuarios(pagina=${i}, busca=${busca})}" th:text="${i + 1}">1</a>
                </li>
            </ul>
        </nav>
    </main>
</div>
<th:block th:replace="~{admin/fragments :: scripts}"></th:block>
</body>
</html>
